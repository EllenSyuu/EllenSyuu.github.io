name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Work out the site URL from the repository name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "${owner}.github.io" ]; then prefix=""; else prefix="/${repo}"; fi
          echo "GATSBY_PATH_PREFIX=${prefix}" >> "$GITHUB_ENV"
          echo "GATSBY_SITE_URL=https://${owner}.github.io${prefix}" >> "$GITHUB_ENV"
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            public
          key: gatsby-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: gatsby-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx gatsby build --prefix-paths
        env:
          GATSBY_TELEMETRY_DISABLED: 1
          GATSBY_FORM_KEY: ${{ secrets.GATSBY_FORM_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
